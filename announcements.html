<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu annonces — Los Santos Customs</title>
<link rel="icon" href="assets/img/logo.webp">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('lsc_theme'))||{};document.documentElement.setAttribute('data-theme',t.mode==='dark'?'dark':'light');document.documentElement.setAttribute('data-accent',t.accent||'green');document.documentElement.setAttribute('data-radius',t.radius||'soft');}catch(e){}})();</script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/theme.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-root"></div>
    <div class="main">
      <div id="topbar-root"></div>
      <div class="content" style="max-width:640px;">

        <div class="page-head">
          <div><h1>Menu annonces</h1><div class="sub">Le dernier message prêt à copier dans le jeu.</div></div>
        </div>

        <div class="card card-pad" id="current-ad" style="display:flex;flex-direction:column;gap:12px;">
          <div class="skeleton" style="height:44px;"></div>
          <div class="skeleton" style="height:44px;"></div>
          <div class="skeleton" style="height:80px;"></div>
        </div>

        <div class="flex-between mt-24 mb-16">
          <h3 style="font-size:15px;">Dernières annonces</h3>
          <button class="btn btn-accent" id="publish-btn">Publier une annonce</button>
        </div>

        <div class="card" id="history-card">
          <div id="history-list"></div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/announcements.js"></script>
</body>
</html>
