<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gestion des rôles — Los Santos Customs</title>
<link rel="icon" href="data:,">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('lsc_theme'))||{};document.documentElement.setAttribute('data-theme',t.mode==='dark'?'dark':'light');document.documentElement.setAttribute('data-accent',t.accent||'green');document.documentElement.setAttribute('data-radius',t.radius||'soft');}catch(e){}})();</script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/theme.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-root"></div>
    <div class="main">
      <div id="topbar-root"></div>
      <div class="content">

        <div class="page-head">
          <div><h1>Gestion des rôles</h1><div class="sub">Crée des rôles à la Discord : permissions de base, puis exceptions par employé.</div></div>
          <button class="btn btn-accent" id="new-role-btn">＋ Nouveau rôle</button>
        </div>

        <div class="two-col" style="grid-template-columns: 300px 1fr;">
          <div class="card card-pad">
            <div class="role-list" id="role-list"></div>
          </div>

          <div id="role-detail"></div>
        </div>

        <div class="card mt-24" id="overrides-card">
          <div class="card-title-row">
            <div><h3>Permissions individuelles</h3><div class="sub">Force une permission pour une seule personne, comme une exception Discord par membre.</div></div>
            <select class="input" id="override-member-select" style="width:260px;"></select>
          </div>
          <div id="override-body" style="padding:6px 20px 20px;"></div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/roles.js"></script>
</body>
</html>
