<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accueil — Los Santos Customs</title>
<link rel="icon" href="assets/img/logo.webp">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('lsc_theme'))||{};document.documentElement.setAttribute('data-theme',t.mode==='dark'?'dark':'light');document.documentElement.setAttribute('data-accent',t.accent||'green');document.documentElement.setAttribute('data-radius',t.radius||'soft');}catch(e){}})();</script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/theme.css" />
<link rel="stylesheet" href="assets/css/app.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="shell">
    <div id="sidebar-root"></div>
    <div class="main">
      <div id="topbar-root"></div>
      <div class="content">

        <div class="page-head">
          <div><h1 class="greeting" id="greeting">Bonjour</h1></div>
          <div class="badge badge-neutral mono" id="week-badge" style="font-size:13px;padding:8px 14px;">—</div>
        </div>

        <div class="stat-grid" id="stat-grid">
          <!-- stat cards injected by JS -->
        </div>

        <div class="two-col">
          <div class="card">
            <div class="card-title-row">
              <div><h3>Chiffre d'affaire par jour</h3><div class="sub" id="chart-sub">2 dernières semaines</div></div>
            </div>
            <div style="padding:14px 20px 20px;height:260px;"><canvas id="ca-chart"></canvas></div>
          </div>

          <div class="card">
            <div class="card-title-row"><h3>Fiche de paie</h3></div>
            <div class="kv-list" id="fiche-top"></div>
            <div class="kv-list" id="fiche-mid" style="border-top:1px solid var(--c-border);padding-top:6px;"></div>
            <div class="kv-list" id="fiche-total"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
