<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Customs — Management & Comptabilité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <div class="brand">
    <div class="logo img" id="brandLogo"><img src="img/logo.png" alt=""></div>
    <div class="brand-txt"><b id="brandName">Los Santos Customs</b><span id="brandSub">Management & Comptabilité</span></div>
  </div>

  <header class="topbar">
    <div class="top-search">
      <i data-lucide="search" class="ic"></i>
      <input id="topSearch" type="text" placeholder="Rechercher un service, un produit..." autocomplete="off">
      <kbd>Ctrl K</kbd>
    </div>
    <div class="top-partner" id="topPartner"></div>
    <div class="top-right">
      <button class="svc-btn off" id="svcBtn" hidden></button>
      <button class="btn sm" id="advertBtn" title="Annonce publicitaire"><i data-lucide="megaphone" class="ic"></i>Advert</button>
      <button class="icon-btn bell" id="bellBtn" title="Notifications"><i data-lucide="bell" class="ic"></i><span class="count" id="bellCount" hidden></span></button>
      <div class="clock" id="clock"></div>
      <button class="user-btn" id="userBtn"></button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Navigation principale"></nav>
  <main class="main" id="main"></main>
</div>

<div id="deco" aria-hidden="true"></div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core/server.js"></script>
<script src="js/core/seed.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/pos.js"></script>
<script src="js/pages/accounting.js"></script>
<script src="js/pages/hr.js"></script>
<script src="js/pages/company.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
